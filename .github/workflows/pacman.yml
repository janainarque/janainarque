name: Update Pac-Man contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate contribution graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          hide_month_labels: 'false'

      - name: Style contribution cells and remove SVG backgrounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = {
              "pacman-contribution-graph.svg": ("#ffffff", "#ebedf0", "#c3cad4"),
              "pacman-contribution-graph-dark.svg": ("#0d1117", "#161b22", "#161b22"),
          }
          for filename, (background, original_cell, gray_cell) in styles.items():
              path = Path("dist") / filename
              svg = path.read_text(encoding="utf-8")
              rect = f'<rect width="100%" height="100%" fill="{background}"/>'
              cell = f'fill="{original_cell}"'
              if svg.count(rect) != 1 or svg.count(cell) == 0:
                  raise SystemExit(f"Unexpected SVG layout: {path}")
              svg = svg.replace(rect, "", 1)
              count = svg.count(cell)
              svg = svg.replace(cell, f'fill="{gray_cell}"')
              path.write_text(svg, encoding="utf-8")
              print(f"Transparent background; {count} cells styled gray: {path}")
          PY

      - name: Prepare theme-adaptive profile animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("dist/pacman-contribution-graph-dark.svg")
          target = Path("dist/pacman-adaptive.svg")
          svg = source.read_text(encoding="utf-8")
          old = 'fill="#161b22"'
          if svg.count(old) < 100:
              raise SystemExit("Unexpected dark SVG: empty contribution cells not found")
          # Semi-transparent slate blends with the viewer's GitHub background:
          # near-black in dark mode, light gray in light mode.
          svg = svg.replace(old, 'fill="rgba(71,85,105,0.16)"')
          target.write_text(svg, encoding="utf-8")
          print(f"Theme-adaptive SVG written: {target}")
          PY

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
